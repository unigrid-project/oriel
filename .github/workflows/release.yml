name: Oriel release

# Started by pushing a tag such as v0.0.1, or by hand with a version. It builds and tests that commit and
# leaves a draft release with the jars, which nobody sees until it is published from the Releases page.
# Applications fetch a published version through JitPack, which builds it from the tag; see jitpack.yml.
# JitPack takes the tag as the Maven version, which has to start with a digit, so once a release is published
# its commit is also tagged with the plain version, such as 0.0.1, and that is the one applications name.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, such as 0.0.1, without a leading v"
        type: string
        required: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

jobs:
  check:

    if: github.event_name != 'release'

    runs-on: ubuntu-22.04

    permissions:
      actions: read
      contents: read

    outputs:
      version: ${{ steps.what.outputs.version }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Check what is about to be released
      id: what
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
        REPOSITORY: ${{ github.repository }}
      run: |
        if [ "$EVENT" = "push" ]; then
          version="${GITHUB_REF_NAME#v}"

          # A tag can be pushed from any branch; only what master holds is ever released.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "$GITHUB_REF_NAME is not on master" >&2
            exit 1
          fi
        else
          version="$INPUT_VERSION"

          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Releases are made from master, not from $GITHUB_REF" >&2
            exit 1
          fi

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The version must look like 0.0.1, not '$version'" >&2
            exit 1
          fi

          # The plain tag is the one JitPack serves, so a version that has either is already taken.
          for tag in "v$version" "$version"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag is already tagged" >&2
              exit 1
            fi
          done
        fi

        # The jars carry the version of the pom, so the tag has to name the same one.
        built=$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)

        if [ "$built" != "$version" ]; then
          echo "The pom is at $built, not at $version" >&2
          exit 1
        fi

        # The release commit only sets the version, so the checks that passed on the commit before it count.
        passed=0

        for commit in "$GITHUB_SHA" "$(git rev-parse "$GITHUB_SHA^")"; do
          passed=$((passed + $(gh run list --repo "$REPOSITORY" --workflow maven.yml --commit "$commit" \
            --status success --json databaseId --jq length)))
        done

        if [ "$passed" -eq 0 ]; then
          echo "The build checks have passed neither for $GITHUB_SHA nor for the commit before it" >&2
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"

  draft:

    needs: check

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build and test
      run: ./mvnw -B install

    - name: Collect the jars
      env:
        VERSION: ${{ needs.check.outputs.version }}
      run: |
        mkdir dist
        cp oriel-server/target/oriel-server-$VERSION.jar oriel-server/target/oriel-server-$VERSION-tests.jar \
          oriel-window/target/oriel-window-$VERSION.jar dist/
        (cd dist && sha256sum *.jar > SHA256SUMS)

    - name: Leave a draft release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.check.outputs.version }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        flags=""

        if [ "$PRERELEASE" = "true" ]; then
          flags="--prerelease"
        fi

        gh release create "v$VERSION" dist/* --draft $flags --target "$GITHUB_SHA" \
          --title "Oriel $VERSION" --generate-notes

  jitpack:

    # The plain tag waits until the release is published: a draft made by hand has no tag of its own before
    # then, and JitPack would build any tag it is asked for, so an application could depend on a draft nobody
    # has looked at yet.
    if: github.event_name == 'release'

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Tag the release's commit with its plain version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version="${TAG#v}"

        if [ "$version" = "$TAG" ] || ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "$TAG is not a release tag such as v0.0.1" >&2
          exit 1
        fi

        commit=$(git rev-parse "$TAG^{commit}")

        if existing=$(git rev-parse -q --verify "refs/tags/$version^{commit}"); then
          if [ "$existing" = "$commit" ]; then
            echo "$version already names $commit"
            exit 0
          fi

          echo "$version names $existing, not $commit, the commit of $TAG" >&2
          exit 1
        fi

        git tag "$version" "$commit"
        git push origin "refs/tags/$version"
