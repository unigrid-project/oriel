name: Oriel build status

on:
  workflow_dispatch:

  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # Oriel is a library for any application, so it names none, not even the one it was taken from. The pattern
    # is written so that this file does not match it.
    - name: Check that Oriel names no other application
      run: |
        if git grep -n -I -i 'j[a]nus'; then
          echo "The lines above name the application Oriel was taken from" >&2
          exit 1
        fi

    - name: Build main
      run: ./mvnw -B install

    # Pull requests only read the repository, so the badge is only ever written from master.
    - name: Publish the coverage badge
      if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      run: .github/publish-coverage-badge.sh
